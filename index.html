<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pos-container">

        <!-- =================================
             LEFT SIDEBAR
        ================================== -->

        <aside class="sidebar">

            <div class="logo">
                <h1>coffeepos</h1>
                <span>Coffee Shop Management</span>
            </div>

            <nav class="nav-menu">

                <a href="index.html" class="nav-item active">
                    <span class="nav-icon">▦</span>
                    <span>POS</span>
                </a>

                <a href="orders.html" class="nav-item ">
                    <span class="nav-icon">▤</span>
                    <span>Orders</span>
                </a>

                <a href="products.html" class="nav-item">
                    <span class="nav-icon">□</span>
                    <span>Products</span>
                </a>

                <a href="reports.html" class="nav-item">
                    <span class="nav-icon">◫</span>
                    <span>Reports</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </div>

        </aside>


        <!-- =================================
             MIDDLE PRODUCT SECTION
        ================================== -->

        <main class="pos-products">

            <div class="top-bar">

                <div class="page-title">
                    <h2>Point of Sale</h2>
                    <p>Select a category and add products to the order.</p>
                </div>

                <div class="top-actions">

                    <div class="search-box">
                        <span class="search-icon">⌕</span>
                        <input type="text" id="product-search" placeholder="Search products...">
                    </div>

                </div>

            </div>


            <!-- CATEGORY BUTTONS -->

            <div class="categories">

                <button class="category active" data-category="food">
                    Food
                </button>

                <button class="category" data-category="beverages">
                    Beverages
                </button>

                <button class="category" data-category="desserts">
                    Desserts
                </button>

            </div>


            <!--
                EMPTY PRODUCT CONTAINER

                Your JavaScript can populate this later.

                Example:

                const productList =
                    document.getElementById("product-list");

            -->

            <section class="product-area">

                <div id="product-list">

                    <!--
                        PRODUCTS WILL BE INSERTED HERE
                        USING JAVASCRIPT
                    -->

                </div>

            </section>

        </main>


        <!-- =================================
             RIGHT ORDER / TABULATION PANEL
        ================================== -->

        <aside class="order-panel">

            <div class="order-header">

                <div>
                    <h2>Current Order</h2>
                    <span class="order-number">
                        Order #0001
                    </span>
                </div>

            </div>


            <!-- ORDER INFORMATION -->

            <div class="order-info">

                <div class="info-box">
                    <label>Order Type</label>
                    <span>Dine In</span>
                </div>

                <div class="info-box">
                    <label>Table</label>
                    <span>--</span>
                </div>

            </div>


            <!-- ORDER ITEM HEADER -->

            <div class="order-items-title">

                <span>ITEM</span>
                <span>AMOUNT</span>

            </div>


            <!--
                EMPTY CART

                JavaScript can populate this.

                Example:

                <div class="order-item">
                    <div class="item-details">
                        <h4>Caramel Latte</h4>
                        <span>2 × ₱150</span>
                    </div>

                    <div class="item-price">
                        ₱300
                    </div>
                </div>
            -->

            <div id="order-items">

                <!--
                    CART ITEMS WILL APPEAR HERE
                -->

            </div>


            <!-- ORDER CALCULATION -->

            <div class="order-summary">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₱0.00</span>
                </div>

                <div class="summary-row">
                    <span>Discount</span>
                    <span id="discount">₱0.00</span>
                </div>

                <div class="summary-row">
                    <span>Tax</span>
                    <span id="tax">₱0.00</span>
                </div>


                <div class="summary-total">

                    <span>Total</span>

                    <span class="total-price" id="total">
                        ₱0.00
                    </span>

                </div>

            </div>


            <!-- PAYMENT -->

            <button class="payment-button" id="payment-button">
                Proceed to Payment
            </button>

            <button class="clear-button" id="clear-order">
                Clear Order
            </button>

        </aside>

    </div>

</body>

</html>
