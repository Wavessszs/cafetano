<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders - Coffee POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pos-container">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="logo">
                <h1>coffeepos</h1>
                <span>Coffee Shop Management</span>
            </div>

            <nav class="nav-menu">

                <a href="index.html" class="nav-item">
                    <span class="nav-icon">▦</span>
                    <span>POS</span>
                </a>

                <a href="orders.html" class="nav-item active">
                    <span class="nav-icon">▤</span>
                    <span>Orders</span>
                </a>

                <a href="products.html" class="nav-item">
                    <span class="nav-icon">□</span>
                    <span>Products</span>
                </a>

                <a href="reports.html" class="nav-item">
                    <span class="nav-icon">◫</span>
                    <span>Reports</span>
                </a>

            </nav>

            <div class="sidebar-bottom">

                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </div>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="page-content">

            <div class="page-header">

                <div class="page-title">
                    <h2>Orders</h2>
                    <p>View and manage customer transactions.</p>
                </div>

                <div class="search-box">

                    <span class="search-icon">⌕</span>

                    <input type="text" id="order-search" placeholder="Search orders...">

                </div>

            </div>


            <!-- FILTERS -->

            <div class="filters">

                <select class="filter-select" id="order-status-filter">
                    <option value="">All Status</option>
                    <option value="completed">Completed</option>
                    <option value="pending">Pending</option>
                    <option value="cancelled">Cancelled</option>
                </select>

                <select class="filter-select" id="order-type-filter">
                    <option value="">All Order Types</option>
                    <option value="dine-in">Dine In</option>
                    <option value="takeout">Takeout</option>
                </select>

                <select class="filter-select" id="order-date-filter">
                    <option value="">All Dates</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>

            </div>


            <!-- ORDERS TABLE -->

            <div class="card table-card">

                <table class="data-table">

                    <thead>

                        <tr>
                            <th>Order</th>
                            <th>Date</th>
                            <th>Order Type</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="orders-table-body">

                        <!--
                        JavaScript can populate orders here.
                    -->

                    </tbody>

                </table>

            </div>

        </main>

    </div>

</body>
<script src="script.js"></script>

</html>
